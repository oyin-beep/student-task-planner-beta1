<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="sign-in.css">
    <title>Sign-in Page</title>
</head>
<body>
    <img src="Texas-Tech-Logo.png" alt="Texas Tech logo" width="150" height="150">
    <header>
        <h1>TTU STUDENT PLANNER</h1>

        <nav>
            <a href="student-planner.html">HOME</a>
            <a href="#">GROUPS</a>
            <a href="#">MAPS</a>
            <a href="#">EVENTS</a>
            <a href="#">SCHEDULE</a>
            <a href="#">CONNECTIONS</a>
            <a href="student-info.html">STUDENT</a>
            <a href="login.html">LOGIN</a>
        </nav>
    </header>

    <main>
        <h2>WELCOME</h2>
        <h3>Sign in</h3>

        <form action="student-info.html" method="get">
            <table class="form-table">
                <tr>
                    <td><label for="username">Username:</label></td>
                    <td><input type="text" id="username" name="username" placeholder="Enter your name" required></td>
                </tr>
                <tr>
                    <td><label for="email">TTU Mail:</label></td>
                    <td><input type="email" id="email" name="email" placeholder="Enter your TTU email" required></td>
                </tr>
                <tr>
                    <td><label for="password">Password:</label></td>
                    <td><input type="password" id="password" name="password" placeholder="Enter your password" required></td>
                </tr>
            </table>

            <button type="submit">Sign In</button>
        </form>

        <p>Already have an account? <a class="switch-link" href="login.html">Login</a></p>
    </main>
</body>
</html>
