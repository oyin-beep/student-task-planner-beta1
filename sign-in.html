<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Iosevka+Charon&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="sign-in.css">
    <title>Sign-in Page</title>
</head>
<body>
    <div class="login-container">

        <main>
            <header>
                <img src="Texas-Tech-Logo.png" alt="Texas Tech logo" width="100" height="100">
                <h1>TTU STUDENT PLANNER</h1>
            </header>

            <h2>WELCOME !</h2>
            <h3>Sign in</h3>

            <form action="student-info.html" method="post">
                <table class="form-table">
                    <tr>
                        <td><label for="username">Username:</label></td>
                        <td><input type="text" id="username" name="username" placeholder="Enter your name" required></td>
                    </tr>
                    <tr>
                        <td><label for="email">TTU Mail:</label></td>
                        <td><input type="email" id="email" name="email" placeholder="Enter your TTU email" required></td>
                    </tr>
                    <tr>
                        <td><label for="password">Password:</label></td>
                        <td><input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="new-password" required></td>
                    </tr>
                </table>

                <button type="submit">Sign In</button>
            </form>

            <p>Already have an account? <a class="switch-link" href="login.html">Login</a></p>

        </main>

        <div class="image-section">
            <img src="campus-sm.webp" alt="Campus">
        </div>

    </div>
    
</body>
</html>
