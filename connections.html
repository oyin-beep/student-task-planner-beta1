<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="connections.css">
    <title>Connections/title>
</head>
<body>
    <header>
        <img src="Texas-Tech-Logo.png" alt="Texas Tech logo" width="100" height="100">
        <h1>TTU STUDENT PLANNER</h1>

        <nav>
            <a href="student-planner.html">HOME</a>
            <a href="groups.html">GROUPS</a>
            <a href="map.html">MAPS</a>
            <a href="eventsindex.html">EVENTS</a>
            <a href="schedule.html">SCHEDULE</a>
            <a href="#">CONNECTIONS</a>
            <a href="student-info.html">USER</a>

        </nav>
    </header>

    <hr>

    <main>

        <!-- Introduction -->
        <section class="intro">
            <h2>Find Your Place at Texas Tech</h2>
            <p>
                Meet new people, discover organizations, and find
                students who share your interests.
            </p>
        </section>

        <!-- Explore Categories -->
        <section class="explore">
            <h2>Explore Connections</h2>

            <div class="category-container">

                <div class="category-card">
                    <h3>Clubs & Organizations</h3>
                    <p>
                        Discover student organizations, cultural groups,
                        professional clubs, and more.
                    </p>
                    <a href="#clubs" class="card-link">Explore Clubs</a>
                </div>

                <div class="category-card">
                    <h3>Connect by Major</h3>
                    <p>
                        Meet students studying the same subject
                        and share academic interests.
                    </p>
                    <a href="#majors" class="card-link">Explore Majors</a>
                </div>

                <div class="category-card">
                    <h3>Connect by Class Year</h3>
                    <p>
                        Find students in your freshman, sophomore,
                        junior, or senior year.
                    </p>
                    <a href="#class-year" class="card-link">Find Students</a>
                </div>

                <div class="category-card">
                    <h3>Campus Events</h3>
                    <p>
                        Discover campus activities, workshops,
                        social gatherings, and meetups.
                    </p>
                    <a href="#campus-events" class="card-link">View Events</a>
                </div>

            </div>
        </section>

        <!-- Popular Clubs -->
        <section class="content-section" id="clubs">
            <h2>Explore Student Organizations</h2>
            <p class="section-description">
                Get involved and find a community that interests you.
            </p>

            <div class="item-container">

                <div class="info-card">
                    <h3>Academic Organizations</h3>
                    <p>
                        Connect with students who share your academic
                        and professional interests.
                    </p>
                </div>

                <div class="info-card">
                    <h3>Cultural Organizations</h3>
                    <p>
                        Celebrate different cultures, traditions,
                        and backgrounds.
                    </p>
                </div>

                <div class="info-card">
                    <h3>Recreational Organizations</h3>
                    <p>
                        Meet people through hobbies, sports,
                        games, and other activities.
                    </p>
                </div>

            </div>
        </section>

        <!-- Connect by Major -->
        <section class="content-section" id="majors">
            <h2>Connect by Major</h2>
            <p class="section-description">
                Find people who understand your classes and academic journey.
            </p>

            <div class="tag-container">
                <span class="tag">Computer Science</span>
                <span class="tag">Engineering</span>
                <span class="tag">Business</span>
                <span class="tag">Biology</span>
                <span class="tag">Mathematics</span>
                <span class="tag">Psychology</span>
            </div>
        </section>

        <!-- Connect by Class Year -->
        <section class="content-section" id="class-year">
            <h2>Connect by Class Year</h2>
            <p class="section-description">
                Meet students who are at a similar stage in college.
            </p>

            <div class="item-container">

                <div class="info-card">
                    <h3>Freshmen</h3>
                    <p>Meet other students beginning their college journey.</p>
                </div>

                <div class="info-card">
                    <h3>Sophomores</h3>
                    <p>Connect with students continuing their college experience.</p>
                </div>

                <div class="info-card">
                    <h3>Juniors & Seniors</h3>
                    <p>Build connections with upper-level students.</p>
                </div>

            </div>
        </section>

        <!-- Campus Events -->
        <section class="content-section" id="campus-events">
            <h2>Campus Events & Meetups</h2>
            <p class="section-description">
                Find opportunities to meet people outside the classroom.
            </p>

            <div class="event-card">
                <h3>Club Meetings</h3>
                <p>Explore organization meetings and get involved.</p>
            </div>

            <div class="event-card">
                <h3>Student Workshops</h3>
                <p>Learn new skills while meeting other students.</p>
            </div>

            <div class="event-card">
                <h3>Social Gatherings</h3>
                <p>Discover activities and events happening around campus.</p>
            </div>
        </section>

    </main>

    <footer>
        <p>Texas Tech University Student Planner</p>
    </footer>

</body>
</html>
