<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Information</title>
</head>
<body>
    <img src ="Texas-Tech-Logo.png" width="150.0" height="150.0">
    <header>
        <h1>TTU STUDENT PLANNER</h1>

        <hr>
        <form action="submit" method="post">
            <table border>
                <thead>
                    <tr>
                        <th>    GROUPS    </th>
                        <th>    MAPS    </th>
                        <th>    EVENTS  </th>
                        <th>    SCHEDULE    </th>
                        <th>    CONNECTIONS </th>
                        <th>    Login/Sign in   </th>
                    </tr>
                </thead>
            </table>
        </form>
    </header>

    <hr>

    <h2>Welcome Username! </h2>

    <h3>Upload profile picture</h3>

    <feedback></feedback>

    <form action="submit" method="post">
        <table>
            <tr>
                <td> <label for= "Major">Major: </label> </td>
                <td> <input type="text" id="major" name="major" placeholder="Enter your major" required> </td>
            </tr>
        </table>

        <br>

        <button type="submit"> Enter </button>

        <br>
        <br>

        <h3>Choose Your Year</h3>
        <input type="radio" id="freshman" name="year" value="freshman">
        <label for="freshman">freshman</label>
        <input type="radio" id="sophmore" name="year" value="sophmore">
        <label for="sophmore">sophmore</label>
        <input type="radio" id="junior" name="year" value="junior">
        <label for="junior">junior</label>
        <input type="radio" id="senior" name="year" value="senior">
        <label for="senior">senior</label>

        <br>
        <br>

        <label for="clubs">select your clubs</label>
        <select id="clubs" name="clubs"> 
            <option value="">choose as many as applies</option>
            <option value="cs">NSBE</option>
            <option value="ce">SWE</option>
            <option value="me">POWER LIFTING</option>
            <option value="ee">ANIME</option>
        </select>
    </form>    

    <hr>

    <h3>Groups</h3>
    <h3>Connections</h3>
    <h3>Events</h3>
    <h3>Frequent Locations</h3>
</body>
</html>
